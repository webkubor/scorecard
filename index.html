<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- 主题色：移动端浏览器地址栏与 PWA 会用它，和 --accent 是同一个值 -->
    <meta name="theme-color" content="#7c94ad" />
    <meta name="description" content="做决定之前，先跑一次体检：粘一个 GitHub 仓库 / npm 包 / 网页 URL，拿到九维度雷达图与整改清单。读不到的判据标「无法核实」而非 0 分。免登录。" />
    <meta property="og:title" content="Scorecard · 做决定之前，先跑一次体检" />
    <meta property="og:description" content="粘一个 GitHub 仓库 / npm 包 / 网页 URL，几秒钟拿到九维度雷达图与整改清单。与 OpenSSF Scorecard 不同：那个管供应链安全，这个管项目成熟度。免登录。" />
    <meta property="og:type" content="website" />
    <!-- 分享卡必须是 PNG：主流平台的 og 抓取器不渲染 SVG，SVG 会分享出空白图 -->
    <meta property="og:image" content="https://scorecard.webkubor.online/og/scorecard/webkubor/typora-Bloom-theme" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://scorecard.webkubor.online/og/scorecard/webkubor/typora-Bloom-theme" />
    <link rel="canonical" href="https://scorecard.webkubor.online/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scorecard · 做决定之前，先跑一次体检" />
    <meta name="twitter:description" content="粘一个 GitHub 仓库 / npm 包 / 网页 URL，拿九维度雷达图与整改清单。读不到的判据标「无法核实」而非 0 分。" />
    <title>Scorecard · 做决定之前，先跑一次体检</title>
    <script>
      // 部署后 CDN 边缘节点没同步齐，老页面按旧 hash 请求 chunk 会 404/返回 index.html 的
      // fallback（MIME 是 text/html，浏览器拒绝当模块执行）——vite 会抛 vite:preloadError。
      // 自动清缓存 + 刷新一次即可自愈，不用等用户手动清缓存或等人工排查。
      // 用时间戳限流（10 秒内只刷新一次），避免新版本真的有问题时无限重刷。
      (function () {
        var KEY = 'scorecard-chunk-reload-ts'
        window.addEventListener('vite:preloadError', function (event) {
          event.preventDefault()
          var now = Date.now()
          var last = Number(sessionStorage.getItem(KEY) || 0)
          if (now - last < 10000) return
          sessionStorage.setItem(KEY, String(now))
          window.location.reload()
        })
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
